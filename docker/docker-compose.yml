services:
  postgres:
    image: postgres:16-alpine
    container_name: sentinel-postgres-dev
    environment:
      POSTGRES_DB: sentinel_db
      POSTGRES_USER: sentinel_user
      POSTGRES_PASSWORD: secure_pass
    ports:
      - "5433:5432"
    volumes:
      - pgdata_volume:/var/lib/postgresql/data
    networks:
      - sentinel-bridge-net

  neo4j:
    image: neo4j:5-community
    container_name: sentinel-neo4j-dev
    environment:
      NEO4J_AUTH: neo4j/secure_neo_pass
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4jdata_volume:/data
    networks:
      - sentinel-bridge-net

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.4
    container_name: sentinel-keycloak-dev
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/sentinel_db
      KC_DB_USERNAME: sentinel_user
      KC_DB_PASSWORD: secure_pass
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_PROXY: edge
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - sentinel-bridge-net

  qdrant:
    image: qdrant/qdrant:v1.8.4
    container_name: sentinel-qdrant-dev
    ports:
      - "6333:6333"
    volumes:
      - qdrant_volume:/qdrant/storage
    networks:
      - sentinel-bridge-net

  redis:
    image: redis:7-alpine
    container_name: sentinel-redis-dev
    ports:
      - "6380:6379"
    networks:
      - sentinel-bridge-net

volumes:
  pgdata_volume:
  neo4jdata_volume:
  qdrant_volume:

networks:
  sentinel-bridge-net:
    driver: bridge
